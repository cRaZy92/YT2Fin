[project]
name = "yt-jellyfin-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "alembic>=1.13",
  "yt-dlp[default]>=2025.11.12",
  "deno>=2.0",
  # PO-token plugin; must be the same version as the brainicism/bgutil-ytdlp-pot-provider image in docker-compose.yml
  "bgutil-ytdlp-pot-provider==2.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx2>=2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/partials/*.html", "static/*", "static/vendor/*",
       "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: downloads from real YouTube (run with -m integration)"]
addopts = "-m 'not integration'"
