# Developer CLI config. The app migrates itself on startup (app/db.py: init_db).
#   .venv/bin/alembic revision --autogenerate -m "describe the change"
# Uses $CONFIG_DIR/app.db (default ./config/app.db) to compare against.
[alembic]
script_location = app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
