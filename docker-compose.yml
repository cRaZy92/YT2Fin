services:
  yt-jellyfin-sync:
    build: .
    image: yt-jellyfin-sync:latest
    container_name: yt-jellyfin-sync
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    environment:
      PUID: "1000"         # owner of downloaded files; match the user Jellyfin reads as
      PGID: "1000"
      TZ: "Europe/Bratislava"
      # AUTH_USER: "admin"
      # AUTH_PASSWORD: "change-me"
    volumes:
      - ./config:/config
      - /srv/media:/media  # the media folder your Jellyfin library points at
